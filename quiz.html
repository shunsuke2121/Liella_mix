<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liella! 声当てクイズ</title>
<style>
  :root{--ink:#2a2740;--sub:#8f8aa3;--line:#e9e7f2;--bg:#fff;--band:#f2f1fa;
    --pink:#ff2d6b;--blue:#2e47fb;--accent:#ff2d6b;
    --grad:linear-gradient(135deg,#2e47fb 0%,#e40080 55%,#ff0043 100%)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Noto Sans JP","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2e47fb,#e40080,#ff0043);z-index:100}
  .wrap{max-width:760px;margin:0 auto;padding:22px 14px 70px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .home{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--grad);color:#fff;text-decoration:none;font-size:15px;font-weight:900}
  .top h1{margin:0;font-size:17px;font-weight:900}
  .lead{color:var(--sub);font-size:12px;line-height:1.8;margin:8px 0 0}

  /* スコア */
  .score{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .sc{flex:1 1 90px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
  .sc b{display:block;font-size:20px;font-weight:900;line-height:1.1}
  .sc span{font-size:10.5px;font-weight:800;color:var(--sub)}
  .sc.hot b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  /* 設定 */
  .opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:12px;color:var(--sub)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:7px 13px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;color:var(--sub)}
  .seg button.sel{background:var(--grad);color:#fff}

  /* 出題 */
  .stage{margin-top:16px;background:var(--band);border-radius:20px;padding:20px 18px;text-align:center;position:relative;overflow:hidden}
  .stage .q{font-size:13px;font-weight:800;color:var(--sub)}
  .stage .big{font-size:30px;font-weight:900;margin:8px 0 4px}
  .stage .song{font-size:11.5px;font-weight:800;color:var(--sub)}
  .bars{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:56px;margin:14px 0 4px}
  .bars i{width:6px;background:var(--grad);border-radius:3px;height:6px;transition:height .08s linear;opacity:.85}
  .play{margin-top:6px;border:none;border-radius:999px;background:var(--grad);color:#fff;font-family:inherit;font-size:14px;font-weight:900;padding:13px 28px;cursor:pointer;box-shadow:0 6px 16px rgba(46,71,251,.3)}
  .play:active{transform:scale(.97)}
  .play[disabled]{opacity:.55;cursor:default}
  .hintbtn{background:#fff;border:1.5px solid var(--line);color:var(--sub);border-radius:999px;font-family:inherit;font-size:12px;font-weight:800;padding:9px 16px;cursor:pointer;margin-left:8px}
  .hintbtn:hover{border-color:var(--accent);color:var(--accent)}

  /* 選択肢 */
  .choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-top:16px}
  .ch{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;font-family:inherit;transition:.14s}
  .ch:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c)}
  .ch:disabled{cursor:default}
  .ch img{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 5px;background:#fff;transition:.14s}
  .ch .n{font-size:11.5px;font-weight:800;color:var(--sub);line-height:1.25}
  .ch.correct{border-color:var(--c);background:var(--cg2);box-shadow:0 6px 18px var(--cg2)}
  .ch.correct .n{color:var(--cd)}
  .ch.wrong{border-color:#ffc9c9;background:#fff5f5;opacity:.85}
  .ch.wrong img{filter:grayscale(1) opacity(.5)}
  .ch.dim{opacity:.4}

  /* 結果 */
  .result{margin-top:16px;border-radius:16px;padding:14px 16px;display:none;align-items:center;gap:12px;border:1px solid var(--line);background:#fff}
  .result.show{display:flex}
  .result img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:3px solid var(--c)}
  .result .t{flex:1;min-width:0}
  .result .h{font-size:15px;font-weight:900}
  .result .s{font-size:11.5px;color:var(--sub);margin-top:3px}
  .next{border:none;border-radius:999px;background:var(--grad);color:#fff;font-family:inherit;font-size:13px;font-weight:900;padding:11px 20px;cursor:pointer;white-space:nowrap}
  .next:active{transform:scale(.97)}
  .loading{text-align:center;color:var(--sub);font-size:12px;margin-top:12px}
  .warn{display:none;background:#fff3f3;border:1px solid #ffc9c9;color:#c0392b;padding:11px 13px;border-radius:12px;font-size:12.5px;margin-top:12px}
  .warn.show{display:block}
  @media(max-width:560px){.stage .big{font-size:24px}.choices{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}.ch img{width:38px;height:38px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="index.html" title="ポータルへ">✦</a><h1>声当てクイズ</h1></div>
  <p class="lead">流れる歌声は誰のもの？ 曲も場所もランダムです。伴奏なしの「声だけ」なので耳を澄ませて。</p>

  <div class="score">
    <div class="sc"><b id="scCorrect">0</b><span>正解</span></div>
    <div class="sc"><b id="scTotal">0</b><span>出題</span></div>
    <div class="sc hot"><b id="scStreak">0</b><span>連続正解</span></div>
    <div class="sc"><b id="scBest">0</b><span>最高記録</span></div>
  </div>

  <div class="opts">
    <span>難易度</span>
    <span class="seg" id="lvSeg">
      <button data-lv="easy" class="sel">やさしい(4択)</button>
      <button data-lv="hard">むずかしい(全員)</button>
    </span>
    <span class="seg" id="lenSeg">
      <button data-len="3">3秒</button>
      <button data-len="6" class="sel">6秒</button>
      <button data-len="10">10秒</button>
    </span>
  </div>

  <div class="warn" id="warn">⚠️ 音源が読み込めませんでした。ローカルで開く場合は <code>start.bat</code> から起動してください。</div>

  <section class="stage">
    <div class="q" id="qLabel">第1問</div>
    <div class="big" id="qBig">🎤 ？？？</div>
    <div class="song" id="qSong"></div>
    <div class="bars" id="bars"></div>
    <button class="play" id="playBtn">▶ 聴く</button>
    <button class="hintbtn" id="hintBtn">ヒント</button>
    <div class="loading" id="loading"></div>
  </section>

  <div class="choices" id="choices"></div>

  <div class="result" id="result">
    <img id="rsImg" alt="">
    <div class="t"><div class="h" id="rsHead"></div><div class="s" id="rsSub"></div></div>
    <button class="next" id="nextBtn">次の問題 →</button>
  </div>
</div>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC();
const master=ctx.createGain();master.gain.value=1;
const analyser=ctx.createAnalyser();analyser.fftSize=128;
const abuf=new Float32Array(analyser.fftSize);
master.connect(analyser);master.connect(ctx.destination);

const LS='liella_quiz';
let stats=(()=>{try{return JSON.parse(localStorage.getItem(LS))||{c:0,t:0,best:0}}catch(e){return{c:0,t:0,best:0}}})();
let streak=0, level='easy', clipLen=6;
let cur=null, src=null, playing=false, raf=null, answered=false, qNo=0;
const cache={};                                    // 'song/slug' -> AudioBuffer

/* クイズに使える曲＝声ステムがある曲 */
const QSONGS=SONGS.filter(s=>s.stem);

function saveStats(){try{localStorage.setItem(LS,JSON.stringify(stats))}catch(e){}}
function renderScore(){
  $('#scCorrect').textContent=stats.c;$('#scTotal').textContent=stats.t;
  $('#scStreak').textContent=streak;$('#scBest').textContent=stats.best;
}

/* バー（声のレベル表示） */
function buildBars(){const b=$('#bars');b.innerHTML='';for(let i=0;i<18;i++)b.appendChild(document.createElement('i'));}
function animBars(){
  analyser.getFloatTimeDomainData(abuf);
  let s=0;for(let i=0;i<abuf.length;i++)s+=abuf[i]*abuf[i];
  const lvl=Math.min(1,Math.sqrt(s/abuf.length)*6);
  [...$('#bars').children].forEach((el,i)=>{
    const k=Math.sin((Date.now()/120)+i*0.7)*0.35+0.65;
    el.style.height=(6+lvl*46*k).toFixed(1)+'px';
  });
  raf=requestAnimationFrame(animBars);
}
function stopBars(){cancelAnimationFrame(raf);[...$('#bars').children].forEach(el=>el.style.height='6px');}

async function loadVocal(song,slug){
  const key=song.id+'/'+slug;
  if(cache[key])return cache[key];
  const res=await fetch(encodeURI(song.vocalBase+slug+'.m4a'));
  if(!res.ok)throw new Error('HTTP '+res.status);
  const buf=await ctx.decodeAudioData(await res.arrayBuffer());
  cache[key]=buf;return buf;
}

function pick(arr,n){const a=arr.slice(),o=[];while(o.length<n&&a.length)o.push(a.splice(Math.random()*a.length|0,1)[0]);return o;}

async function newQuestion(){
  stopClip();answered=false;
  $('#result').classList.remove('show');
  $('#qBig').textContent='🎤 ？？？';
  $('#choices').innerHTML='';
  qNo++;$('#qLabel').textContent='第'+qNo+'問';
  const song=QSONGS[Math.random()*QSONGS.length|0];
  const members=song.members||MEMBERS;
  const answer=members[Math.random()*members.length|0];
  $('#qSong').textContent='♪ '+song.title;
  $('#loading').textContent='読み込み中…';
  $('#playBtn').disabled=true;
  let buf;
  try{ buf=await loadVocal(song,answer.slug); }
  catch(e){ $('#warn').classList.add('show');$('#loading').textContent='';return; }
  // 歌っている可能性が高い区間（イントロ・アウトロを避ける）
  const dur=buf.duration, from=Math.min(20,dur*0.12), to=Math.max(from+1,dur-Math.max(20,clipLen+5));
  const start=from+Math.random()*(to-from);
  const opts = level==='easy'
      ? shuffle([answer].concat(pick(members.filter(m=>m.slug!==answer.slug),3)))
      : members.slice();
  cur={song,answer,buf,start,opts};
  $('#loading').textContent='';$('#playBtn').disabled=false;
  renderChoices();
  playClip();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderChoices(){
  const box=$('#choices');box.innerHTML='';
  cur.opts.forEach(m=>{
    const b=document.createElement('button');
    b.className='ch';b.dataset.slug=m.slug;
    b.style.cssText=`--c:${m.c};--cd:${textCol(m.c)};--cg2:${tint(m.c,.18)}`;
    b.innerHTML=`<img src="${iconOf(m)}" alt=""><div class="n">${m.name}</div>`;
    b.addEventListener('click',()=>answer(m,b));
    box.appendChild(b);
  });
}

function playClip(){
  if(!cur)return;
  stopClip();
  if(ctx.state==='suspended')ctx.resume();
  src=ctx.createBufferSource();src.buffer=cur.buf;
  const g=ctx.createGain();g.gain.value=0;
  src.connect(g);g.connect(master);
  const t=ctx.currentTime;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.12);          // フェードイン
  g.gain.setValueAtTime(1,t+clipLen-.25);g.gain.linearRampToValueAtTime(0,t+clipLen); // フェードアウト
  src.start(t,cur.start,clipLen);
  playing=true;$('#playBtn').textContent='■ 停止';
  animBars();
  src.onended=()=>{playing=false;$('#playBtn').textContent='▶ もう一度';stopBars();};
}
function stopClip(){
  if(src){try{src.onended=null;src.stop();}catch(e){}src=null;}
  playing=false;$('#playBtn').textContent='▶ 聴く';stopBars();
}

function answer(m,btn){
  if(answered||!cur)return;
  answered=true;stopClip();
  const ok=m.slug===cur.answer.slug;
  stats.t++;if(ok){stats.c++;streak++;if(streak>stats.best)stats.best=streak;}else{streak=0;}
  saveStats();renderScore();
  [...document.querySelectorAll('.ch')].forEach(b=>{
    b.disabled=true;
    if(b.dataset.slug===cur.answer.slug)b.classList.add('correct');
    else if(b===btn)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const a=cur.answer;
  $('#qBig').textContent=a.name;
  $('#rsImg').src=iconOf(a);
  $('#result').style.setProperty('--c',a.c);
  $('#rsHead').textContent=ok?'⭕ 正解！':'❌ 残念…';
  $('#rsSub').textContent=`${a.name}（${a.cv.replace('CV.','CV. ')}）／ ${cur.song.title} ${fmtTime(cur.start)}あたり`;
  $('#result').classList.add('show');
}

/* ヒント：候補を半分に減らす（むずかしいモードで有効） */
function hint(){
  if(!cur||answered)return;
  const wrong=[...document.querySelectorAll('.ch')].filter(b=>b.dataset.slug!==cur.answer.slug&&!b.classList.contains('dim'));
  const drop=pick(wrong,Math.ceil(wrong.length/2));
  drop.forEach(b=>{b.classList.add('dim');b.disabled=true;});
}

/* events */
$('#playBtn').addEventListener('click',()=>playing?stopClip():playClip());
$('#hintBtn').addEventListener('click',hint);
$('#nextBtn').addEventListener('click',newQuestion);
$('#lvSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  level=b.dataset.lv;[...e.currentTarget.children].forEach(x=>x.classList.toggle('sel',x===b));newQuestion();});
$('#lenSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  clipLen=+b.dataset.len;[...e.currentTarget.children].forEach(x=>x.classList.toggle('sel',x===b));});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.code==='Space'){e.preventDefault();playing?stopClip():playClip();}
  else if(e.key==='Enter'&&answered){e.preventDefault();newQuestion();}
});
if(location.protocol==='file:')$('#warn').classList.add('show');

/* 起動 */
buildBars();renderScore();newQuestion();
</script>
</body>
</html>
